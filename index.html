```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- MOBILE + NO ZOOM -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
/* Mobile layout */
html, body {
    width: 100%;
    max-width: 480px;
    margin: auto;
    overflow-x: hidden;
    touch-action: pan-y;
}

/* Prevent landscape layout */
@media (orientation: landscape) {
    body {
        max-width: 480px;
        overflow: hidden;
    }
}
</style>
</head>

<body>

<h2>Chlms Brownie</h2>
<p>Freshly baked brownies made with love.</p>

<button>Order Now</button>

<script>
// Prevent pinch zoom
document.addEventListener("touchmove", function(e) {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

// Prevent double-tap zoom
let lastTouch = 0;
document.addEventListener("touchend", function(e) {
    let now = Date.now();

    if (now - lastTouch < 300) {
        e.preventDefault();
    }

    lastTouch = now;
}, { passive: false });

// Try to lock portrait
if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("portrait").catch(() => {});
}
</script>

</body>
</html>
